name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - name: fail if make check changed go.mod or go.sum
        run: git diff --exit-code go.mod go.sum

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --no-banner --redact

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: migrations apply, roll back fully, and apply again
        run: |
          docker compose up -d --wait postgres
          make migrate-up
          make migrate-down-all
          make migrate-up
      - name: fail if db/postgres/ddl/schema.sql does not match the migrations
        run: make ddl-check
